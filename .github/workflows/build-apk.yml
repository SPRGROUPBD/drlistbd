name: Build Doctor List BD APK

on:
  push:
    branches: [ main, master, "audit/**" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK and (when configured) signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::Android sdkmanager not found at $SDKMANAGER"; exit 1; }
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -e
          if [[ "$license_status" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed (sdkmanager exit $license_status)."
            exit "$license_status"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      # Never generate a predictable or throwaway release key. A new random key
      # cannot update an app signed by the previous key, so release builds require
      # the owner's persistent upload keystore in GitHub Actions Secrets.
      - name: Configure persistent release signing (optional for non-release builds)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" && -z "$SECRET_STORE_PASSWORD" && -z "$SECRET_KEY_PASSWORD" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::A version tag requires the persistent KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD secrets."
              exit 1
            fi
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release APK skipped: persistent signing secrets are not configured. Debug APK will still be built."
            exit 0
          fi

          if [[ -z "$KEYSTORE_BASE64" || -z "$SECRET_STORE_PASSWORD" || -z "$SECRET_KEY_PASSWORD" ]]; then
            echo "::error::Configure all three release signing secrets together."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks
          keytool -list -keystore my-upload-key.jks -storepass "$SECRET_STORE_PASSWORD" -alias upload >/dev/null
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Ensure Secrets Gradle Plugin environment file exists
        run: touch .env

      - name: Build signed Release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Doctor-List-BD-debug.apk
          if [[ "${{ steps.signing.outputs.configured }}" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Doctor-List-BD-release.apk
          fi
          ls -lh dist/

      - name: Upload Release APK Artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Doctor-List-BD-Release-APK
          path: dist/Doctor-List-BD-release.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Doctor-List-BD-Debug-APK
          path: dist/Doctor-List-BD-debug.apk
          retention-days: 14

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Doctor-List-BD-release.apk
            dist/Doctor-List-BD-debug.apk
          generate_release_notes: true

      - name: Build Summary
        if: always()
        run: |
          echo "### Doctor List BD — APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Package Name:** `com.doctorlist.bd`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ad SDK dependencies preserved:** Unity Ads, Start.io and Wortise" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Debug APK:** built on successful workflow runs" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.signing.outputs.configured }}" == "true" ]]; then
            echo "- **Release APK:** signed with the persistent upload keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Release APK:** skipped because persistent signing secrets are not configured" >> "$GITHUB_STEP_SUMMARY"
          fi
