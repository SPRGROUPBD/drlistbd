<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body class="min-h-screen">

          বাংলা / EN

    <div id="appRoot"></div>
  </main>

<script>
const RTDB_BASE = "https://octor-aad88-default-rtdb.europe-west1.firebasedatabase.app/directory";
let lang = localStorage.getItem("dlbd_adv_lang") || "bn";
let session = JSON.parse(sessionStorage.getItem("dlbd_adv_session") || "null");
let authMode = "login"; // login | register
let activeTab = "packages"; // packages | status | payments
let renewSourceAd = null;
let isLoading = false;

const PLACEMENT_OPTIONS = [
  { key: "ALL", labelEn: "All Screens", labelBn: "সকল স্ক্রিন (All Screens)" },
  { key: "HOME", labelEn: "Home Screen", labelBn: "হোম স্ক্রিন (Home)" },
  { key: "DOCTOR_LIST", labelEn: "Doctor List", labelBn: "ডাক্তার তালিকা (Doctor List)" },
  { key: "DOCTOR_DETAILS", labelEn: "Doctor Details", labelBn: "ডাক্তার প্রোফাইল (Doctor Details)" },
  { key: "HOSPITAL_LIST", labelEn: "Hospital List", labelBn: "হাসপাতাল তালিকা (Hospital List)" },
  { key: "DIAGNOSTIC_LIST", labelEn: "Diagnostic Center List", labelBn: "ডায়াগনস্টিক সেন্টার তালিকা" },
  { key: "SPECIALIST", labelEn: "Medical Specialist", labelBn: "চিকিৎসা বিশেষজ্ঞ (Specialist)" },
  { key: "CHAMBER_SCHEDULE", labelEn: "Chamber Schedule", labelBn: "চেম্বার সময়সূচি (Chamber)" },
  { key: "ABOUT_US", labelEn: "About Us Screen", labelBn: "আমাদের সম্পর্কে (About Us)" }
];

let portalData = {
  packages: [], // ONLY Admin-added ACTIVE packages from RTDB
  paymentSettings: {
    bkashNumber: "",
    bkashAccountType: "Personal",
    nagadNumber: "",
    nagadAccountType: "Personal",
    rocketNumber: "",
    rocketAccountType: "Personal",
    instructionsBn: "",
    instructionsEn: ""
  },
  myAds: [],
  myPayments: []
};

let draftForm = {
  packageId: "",
  businessName: "",
  contactPersonName: "",
  contactNumber: "",
  mediaType: "IMAGE", // IMAGE | VIDEO
  bannerImageUrl: "",
  videoUrl: "",
  logoUrl: "",
  title: "",
  description: "",
  websiteUrl: "",
  selectedPlacement: "ALL",
  paymentMethod: "BKASH", // BKASH | NAGAD | ROCKET
  senderMobile: "",
  transactionId: "",
  amountBdt: "0",
  screenshotUrl: ""
};

function t(bn, en) { return lang === "bn" ? bn : en; }
function esc(v) { return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 12); }

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 3400);
}

function toggleLang() {
  lang = lang === "bn" ? "en" : "bn";
  localStorage.setItem("dlbd_adv_lang", lang);
  render();
}

// Fixed Package Pricing Formula: Total Package Price = Fixed Package Rate (NEVER multiply by durationDays)
function calculateFixedPackageTotal(fixedRateBdt) {
  const val = parseInt(fixedRateBdt, 10);
  return isNaN(val) || val < 0 ? 0 : val;
}

function getSelectedPackage() {
  return portalData.packages.find(p => p.id === draftForm.packageId) || null;
}

function isVideoPackage(pkg) {
  if (!pkg) return false;
  const pt = String(pkg.placementType || "").toUpperCase();
  const at = String(pkg.adType || "").toUpperCase();
  const sz = String(pkg.sizeLabel || "").toUpperCase();
  return pt === "REWARD_VIDEO_DOCTOR_CLICK" || at.includes("VIDEO") || sz.includes("VIDEO");
}

function resolvePackageSizeLabel(pkg) {
  if (!pkg) return "Responsive";
  if (pkg.sizeLabel && String(pkg.sizeLabel).trim()) return String(pkg.sizeLabel).trim();
  if (isVideoPackage(pkg)) return "Video";
  if (Number(pkg.widthPx || 0) > 0 && Number(pkg.heightPx || 0) > 0) {
    return `${pkg.widthPx}×${pkg.heightPx} px`;
  }
  return "Responsive";
}

function resolvePackagePlacementLabel(pkg) {
  const raw = String(pkg?.adPlacement || pkg?.targetPages || "ALL").trim();
  const found = PLACEMENT_OPTIONS.find(o => o.key === raw.toUpperCase());
  if (found) return t(found.labelBn, found.labelEn);
  return raw || t("সকল স্ক্রিন", "All Screens");
}

function syncSelectedPackageDefaults(pkg) {
  if (!pkg) {
    draftForm.amountBdt = "0";
    return;
  }
  draftForm.amountBdt = String(calculateFixedPackageTotal(pkg.priceBdt));
  draftForm.mediaType = isVideoPackage(pkg) ? "VIDEO" : "IMAGE";
  const rawPlace = String(pkg.adPlacement || "ALL").trim().toUpperCase();
  const matched = PLACEMENT_OPTIONS.find(o => o.key === rawPlace);
  draftForm.selectedPlacement = matched ? matched.key : "ALL";
}

// SHA-256(salt:password) — 100% compatible with Android AdvertiserRemoteService
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function generateSaltHex() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
}

function normalizeMobile(raw) {
  const digits = String(raw || "").replace(/[^0-9]/g, "");
  return digits.length >= 11 ? digits.slice(-11) : digits;
}

function isValidBdMobile(raw) {
  return /^01[3-9]\d{8}$/.test(normalizeMobile(raw));
}

function normalizeTrx(raw) {
  return String(raw || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function isValidImageSrc(url) {
  const c = String(url || "").trim();
  return /^https:\/\/[^\s]+$/i.test(c) || /^data:image\/(png|jpeg|jpg|webp);base64,/i.test(c);
}

function isValidVideoSrc(url) {
  const c = String(url || "").trim();
  return /^https:\/\/[^\s]+$/i.test(c) || /^data:video\/(mp4|webm);base64,/i.test(c);
}

function isValidWebUrl(url) {
  const c = String(url || "").trim();
  return !c || /^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(c);
}

function formatDate(ms) {
  const n = Number(ms || 0);
  return n > 0 ? new Date(n).toISOString().slice(0, 10) : "—";
}

function normalizeStatus(raw) {
  const up = String(raw || "PENDING").trim().toUpperCase();
  if (up === "PENDING_PAYMENT" || up === "PENDING_APPROVAL") return "PAYMENT_PENDING";
  return up;
}

function effectiveStatus(ad) {
  const st = normalizeStatus(ad.status);
  if (st === "ACTIVE") {
    const exp = Number(ad.expiryAt || 0);
    if (exp > 0 && Date.now() > exp) return "EXPIRED";
    if (ad.isActive === false) return "PAUSED";
  }
  return st;
}

function remainingDays(ad) {
  if (effectiveStatus(ad) !== "ACTIVE") return 0;
  const exp = Number(ad.expiryAt || 0);
  if (!exp) return Number(ad.durationDays || 0);
  const diff = exp - Date.now();
  return diff <= 0 ? 0 : Math.ceil(diff / 86400000);
}

function statusBadge(status) {
  const st = normalizeStatus(status);
  const map = {
    PENDING: "bg-slate-100 text-slate-700",
    PAYMENT_PENDING: "bg-amber-100 text-amber-800",
    ACTIVE: "bg-emerald-100 text-emerald-800",
    VERIFIED: "bg-emerald-100 text-emerald-800",
    PAUSED: "bg-indigo-100 text-indigo-800",
    EXPIRED: "bg-orange-100 text-orange-800",
    REJECTED: "bg-rose-100 text-rose-800",
    CANCELLED: "bg-slate-200 text-slate-600"
  };
  const labelMap = {
    PENDING: t("পেন্ডিং (Pending)", "Pending"),
    PAYMENT_PENDING: t("পেমেন্ট যাচাই (Payment Pending)", "Payment Pending"),
    ACTIVE: t("সক্রিয় (Active)", "Active"),
    VERIFIED: t("যাচাইকৃত (Verified)", "Verified"),
    PAUSED: t("বিরতি (Paused)", "Paused"),
    EXPIRED: t("মেয়াদোত্তীর্ণ (Expired)", "Expired"),
    REJECTED: t("প্রত্যাখ্যাত (Rejected)", "Rejected"),
    CANCELLED: t("বাতিল (Cancelled)", "Cancelled")
  };
  return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${map[st] || "bg-slate-100 text-slate-700"}">${esc(labelMap[st] || st)}</span>`;
}

// --- LOAD PACKAGES & ADVERTISER DATA ---
async function loadPublicPackages() {
  try {
    const res = await fetch(`${RTDB_BASE}/ad_packages.json`);
    if (!res.ok) return;
    const raw = (await res.json()) || {};
    portalData.packages = Object.entries(raw)
      .map(([id, p]) => ({ id, ...p }))
      .filter(p => p && String(p.status || "ACTIVE").toUpperCase() === "ACTIVE")
      .sort((a, b) => Number(a.priceBdt || 0) - Number(b.priceBdt || 0));
    render();
  } catch (_) {}
}

async function loadPortalData() {
  if (!session) {
    await loadPublicPackages();
    return;
  }
  isLoading = true;
  render();
  try {
    const res = await fetch(`${RTDB_BASE}.json`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const root = (await res.json()) || {};

    // STRICT: ONLY Admin-created ACTIVE packages
    portalData.packages = Object.entries(root.ad_packages || {})
      .map(([id, p]) => ({ id, ...p }))
      .filter(p => p && String(p.status || "ACTIVE").toUpperCase() === "ACTIVE")
      .sort((a, b) => Number(a.priceBdt || 0) - Number(b.priceBdt || 0));

    if (root.payment_settings) {
      portalData.paymentSettings = {
        ...portalData.paymentSettings,
        ...root.payment_settings
      };
    }

    const allSponsorsRaw = Object.entries(root.sponsors || {}).map(([id, s]) => ({ id, ...s }));
    portalData.myAds = allSponsorsRaw
      .filter(s => s && s.advertiserId === session.id)
      .sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0));

    portalData.myPayments = Object.entries(root.ad_payments || {})
      .map(([id, p]) => ({ id, ...p }))
      .filter(p => p && p.advertiserId === session.id)
      .sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));

    if (!draftForm.businessName) draftForm.businessName = session.businessName || "";
    if (!draftForm.contactPersonName) draftForm.contactPersonName = session.ownerName || "";
    if (!draftForm.contactNumber) draftForm.contactNumber = session.mobile || "";
    if (!draftForm.senderMobile) draftForm.senderMobile = session.mobile || "";

    if (draftForm.packageId && !portalData.packages.some(p => p.id === draftForm.packageId)) {
      draftForm.packageId = "";
    }
    if (!draftForm.packageId && portalData.packages.length > 0) {
      draftForm.packageId = portalData.packages[0].id;
      syncSelectedPackageDefaults(portalData.packages[0]);
    } else if (draftForm.packageId) {
      const pk = getSelectedPackage();
      if (pk) draftForm.amountBdt = String(calculateFixedPackageTotal(pk.priceBdt));
    }
  } catch (err) {
    toast("Sync error: " + err.message);
  } finally {
    isLoading = false;
    render();
  }
}

// --- ADVERTISER AUTH ---
async function handleRegister(e) {
  e.preventDefault();
  const businessName = document.getElementById("reg_biz").value.trim();
  const ownerName = document.getElementById("reg_owner").value.trim();
  const mobile = document.getElementById("reg_mobile").value.trim();
  const email = document.getElementById("reg_email").value.trim().toLowerCase();
  const address = document.getElementById("reg_address").value.trim();
  const password = document.getElementById("reg_pass").value;

  if (!isValidBdMobile(mobile)) return toast(t("সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)", "Enter a valid Bangladesh mobile number (01XXXXXXXXX)"));
  if (password.length < 6) return toast(t("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে", "Password must be at least 6 characters"));

  const existingRes = await fetch(`${RTDB_BASE}/advertisers.json`);
  const existing = (existingRes.ok ? await existingRes.json() : {}) || {};
  const norm = normalizeMobile(mobile);
  for (const adv of Object.values(existing)) {
    if (adv && normalizeMobile(adv.mobile) === norm) {
      return toast(t("এই মোবাইল নম্বর দিয়ে আগেই অ্যাকাউন্ট তৈরি করা হয়েছে!", "An account with this mobile number already exists."));
    }
  }

  const id = uid("adv");
  const salt = generateSaltHex();
  const passwordHash = await sha256Hex(`${salt}:${password}`);
  const now = Date.now();
  const record = { id, businessName, ownerName, mobile, email, address, salt, passwordHash, status: "ACTIVE", createdAt: now, updatedAt: now };

  const putRes = await fetch(`${RTDB_BASE}/advertisers/${id}.json`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(record)
  });
  if (!putRes.ok) return toast("Registration failed. Please try again.");

  session = { id, businessName, ownerName, mobile, email, address };
  sessionStorage.setItem("dlbd_adv_session", JSON.stringify(session));
  toast(t("অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!", "Sponsor account created successfully!"));
  await loadPortalData();
}

async function handleLogin(e) {
  e.preventDefault();
  const identifier = document.getElementById("log_id").value.trim();
  const password = document.getElementById("log_pass").value;

  const res = await fetch(`${RTDB_BASE}/advertisers.json`);
  const all = (res.ok ? await res.json() : {}) || {};
  const normMob = normalizeMobile(identifier);
  const lowId = identifier.toLowerCase();

  let found = null;
  for (const [id, adv] of Object.entries(all)) {
    if (!adv) continue;
    if ((normMob && normalizeMobile(adv.mobile) === normMob) || (adv.email && adv.email.toLowerCase() === lowId)) {
      found = { id, ...adv };
      break;
    }
  }
  if (!found) return toast(t("অ্যাকাউন্ট পাওয়া যায়নি!", "Sponsor account not found."));
  if (String(found.status || "ACTIVE").toUpperCase() !== "ACTIVE") {
    return toast(t("আপনার অ্যাকাউন্টটি অ্যাডমিন কর্তৃক স্থগিত করা হয়েছে।", "This sponsor account is suspended by admin."));
  }
  const hash = await sha256Hex(`${found.salt}:${password}`);
  if (hash !== found.passwordHash) return toast(t("ভুল পাসওয়ার্ড!", "Incorrect password."));

  session = { id: found.id, businessName: found.businessName, ownerName: found.ownerName, mobile: found.mobile, email: found.email || "", address: found.address || "" };
  sessionStorage.setItem("dlbd_adv_session", JSON.stringify(session));
  toast(t("সফলভাবে লগইন হয়েছে!", "Logged in successfully!"));
  await loadPortalData();
}

function logoutAdvertiser() {
  session = null;
  renewSourceAd = null;
  sessionStorage.removeItem("dlbd_adv_session");
  render();
}

// --- PACKAGE SELECTION & MEDIA UPLOAD ---
function selectSponsorPackage(pkgId, shouldScroll) {
  const pkg = portalData.packages.find(p => p.id === pkgId);
  if (!pkg) return;
  draftForm.packageId = pkg.id;
  syncSelectedPackageDefaults(pkg);
  render();
  if (shouldScroll) {
    const formEl = document.getElementById("bookingFormCard");
    if (formEl) formEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function handleUploadImage(event, fieldName) {
  const file = event.target.files?.[0];
  if (!file) return;
  if (!["image/png", "image/jpeg", "image/webp"].includes(file.type)) {
    toast(t("শুধুমাত্র PNG, JPEG বা WebP ছবি অনুমোদিত।", "Only PNG, JPEG, or WebP images are allowed."));
    event.target.value = "";
    return;
  }
  if (file.size > 3 * 1024 * 1024) {
    toast(t("ছবির সাইজ ৩ এমবি-র কম হতে হবে।", "Image size must be under 3 MB."));
    event.target.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let dataUrl = reader.result;
      const w = img.naturalWidth, h = img.naturalHeight;
      if (w > 1080 || file.size > 350000) {
        const scale = w > 1080 ? 1080 / w : 1;
        const c = document.createElement("canvas");
        c.width = Math.round(w * scale);
        c.height = Math.round(h * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        dataUrl = c.toDataURL("image/jpeg", 0.84);
      }
      draftForm[fieldName] = dataUrl;
      toast(t(`ছবি যুক্ত হয়েছে (${w}×${h}px)`, `Image ready (${w}×${h}px)`));
      render();
    };
    img.onerror = () => toast(t("অবৈধ ছবির ফাইল।", "Invalid or corrupted image file."));
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function handleUploadVideo(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  if (!["video/mp4", "video/webm"].includes(file.type)) {
    toast(t("শুধুমাত্র MP4 বা WebM ভিডিও অনুমোদিত।", "Only MP4 or WebM videos are allowed."));
    event.target.value = "";
    return;
  }
  if (file.size > 15 * 1024 * 1024) {
    toast(t("ভিডিও সাইজ ১৫ এমবি-র কম হতে হবে।", "Video file size must be under 15 MB."));
    event.target.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    draftForm.videoUrl = reader.result;
    draftForm.mediaType = "VIDEO";
    toast(t("ভিডিও যুক্ত হয়েছে!", "Video attached successfully!"));
    render();
  };
  reader.onerror = () => toast(t("ভিডিও পড়া যায়নি।", "Could not read video file."));
  reader.readAsDataURL(file);
}

function startRenewAd(adId) {
  const ad = portalData.myAds.find(a => a.id === adId);
  if (!ad) return;
  renewSourceAd = ad;
  const matchingPkg = portalData.packages.find(p => p.id === ad.packageId) || portalData.packages[0] || null;
  draftForm = {
    packageId: matchingPkg ? matchingPkg.id : "",
    businessName: ad.name || session.businessName || "",
    contactPersonName: ad.contactPersonName || session.ownerName || "",
    contactNumber: ad.contactNumber || session.mobile || "",
    mediaType: String(ad.mediaType || (ad.videoUrl ? "VIDEO" : "IMAGE")).toUpperCase(),
    bannerImageUrl: ad.bannerImageUrl || "",
    videoUrl: ad.videoUrl || "",
    logoUrl: ad.logoUrl || "",
    title: ad.promoTitle || ad.title || "",
    description: ad.description || "",
    websiteUrl: ad.websiteUrl || "",
    selectedPlacement: String(ad.adPlacement || ad.targetPages || "ALL").toUpperCase(),
    paymentMethod: "BKASH",
    senderMobile: session.mobile || "",
    transactionId: "",
    amountBdt: matchingPkg ? String(calculateFixedPackageTotal(matchingPkg.priceBdt)) : "0",
    screenshotUrl: ""
  };
  if (matchingPkg) syncSelectedPackageDefaults(matchingPkg);
  activeTab = "packages";
  render();
  setTimeout(() => {
    const formEl = document.getElementById("bookingFormCard");
    if (formEl) formEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 80);
}

async function handleSubmitAdAndPayment(e) {
  e.preventDefault();
  const pkg = getSelectedPackage();
  if (!pkg) return toast(t("অনুগ্রহ করে একটি অ্যাডমিন প্যাকেজ নির্বাচন করুন।", "Please select an active package published by Admin."));

  if (!draftForm.businessName.trim()) return toast(t("প্রতিষ্ঠান বা ব্যবসার নাম দিন।", "Institution / Business Name is required."));
  if (!draftForm.contactPersonName.trim()) return toast(t("যোগাযোগকারীর নাম দিন।", "Contact Person Name is required."));
  if (!isValidBdMobile(draftForm.contactNumber)) return toast(t("সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)", "Enter a valid mobile number (01XXXXXXXXX)."));
  if (!draftForm.title.trim() || draftForm.title.trim().length < 3) return toast(t("বিজ্ঞাপনের শিরোনাম কমপক্ষে ৩ অক্ষরের হতে হবে।", "Advertisement title must be at least 3 characters."));
  if (!isValidWebUrl(draftForm.websiteUrl)) return toast(t("ওয়েবসাইট URL https:// বা http:// দিয়ে শুরু হতে হবে।", "Website / Landing Page URL must start with https:// or http://"));

  const isVid = draftForm.mediaType === "VIDEO" || isVideoPackage(pkg);
  if (isVid) {
    if (!isValidVideoSrc(draftForm.videoUrl) && !isValidImageSrc(draftForm.bannerImageUrl)) {
      return toast(t("বৈধ ভিডিও (MP4/WebM বা HTTPS URL) অথবা থাম্বনেইল ছবি দিন।", "Upload an MP4/WebM video (or HTTPS video URL) or provide a valid banner image."));
    }
  } else {
    if (!isValidImageSrc(draftForm.bannerImageUrl)) {
      return toast(t("বৈধ বিজ্ঞাপন ছবি আপলোড করুন অথবা HTTPS URL দিন।", "Upload a valid ad image or enter an HTTPS image URL."));
    }
  }

  const allowedMethods = ["BKASH", "NAGAD", "ROCKET"];
  const payMethod = allowedMethods.includes(draftForm.paymentMethod) ? draftForm.paymentMethod : "BKASH";
  if (!isValidBdMobile(draftForm.senderMobile)) return toast(t("সঠিক পেমেন্ট প্রেরকের নম্বর দিন (01XXXXXXXXX)", "Enter a valid sender mobile number (01XXXXXXXXX)."));

  const normTrx = normalizeTrx(draftForm.transactionId);
  if (normTrx.length < 5) return toast(t("সঠিক Transaction ID (TrxID) দিন।", "Enter a valid Transaction ID (TrxID)."));

  // FIXED PACKAGE PRICING: Total Package Price = Fixed Package Rate (NEVER multiplied by days)
  const fixedTotalBdt = calculateFixedPackageTotal(pkg.priceBdt);
  const paid = parseInt(draftForm.amountBdt, 10) || 0;
  if (paid < fixedTotalBdt) {
    return toast(t(`নির্ধারিত প্যাকেজ মূল্য কমপক্ষে ৳${fixedTotalBdt} হতে হবে।`, `Payment amount must be at least the fixed package rate ৳${fixedTotalBdt}.`));
  }

  // Strict Duplicate TrxID Check across RTDB
  const payRes = await fetch(`${RTDB_BASE}/ad_payments.json`);
  const allPay = (payRes.ok ? await payRes.json() : {}) || {};
  for (const p of Object.values(allPay)) {
    if (!p || String(p.status).toUpperCase() === "REJECTED") continue;
    if (normalizeTrx(p.transactionIdNormalized || p.transactionId) === normTrx) {
      return toast(t(`এই TrxID (${draftForm.transactionId}) ইতিপূর্বে ব্যবহৃত হয়েছে!`, `Duplicate Transaction ID (${draftForm.transactionId}) already exists!`));
    }
  }

  const now = Date.now();
  const adId = uid("sp");
  const payId = uid("pay");
  const isRenewal = Boolean(renewSourceAd);
  const chosenPlacement = draftForm.selectedPlacement || pkg.adPlacement || "ALL";
  const targetPages = chosenPlacement === "ABOUT_US" ? "about_us" : chosenPlacement;
  const durationDays = Math.max(1, parseInt(pkg.durationDays, 10) || 30);

  // Campaign starts in PAYMENT_PENDING (isActive = false) until Admin verifies payment & approves
  const adPayload = {
    id: adId,
    advertiserId: session.id,
    submittedBy: "ADVERTISER",
    packageId: pkg.id,
    packageName: pkg.name,
    adType: pkg.adType || pkg.placementType || "BANNER",
    adPlacement: chosenPlacement,
    placementType: pkg.placementType || "BANNER_300x200",
    adSizeKey: resolvePackageSizeLabel(pkg),
    widthPx: Number(pkg.widthPx || 300),
    heightPx: Number(pkg.heightPx || 200),
    durationDays,
    priceBdt: fixedTotalBdt,
    subtotalBdt: fixedTotalBdt,
    bundleDiscountBdt: 0,
    status: "PAYMENT_PENDING",
    isActive: false,
    name: draftForm.businessName.trim(),
    sponsorName: draftForm.businessName.trim(),
    contactPersonName: draftForm.contactPersonName.trim(),
    contactNumber: draftForm.contactNumber.trim(),
    promoTitle: draftForm.title.trim(),
    title: draftForm.title.trim(),
    description: draftForm.description.trim(),
    mediaType: isVid ? "VIDEO" : "IMAGE",
    logoUrl: isValidImageSrc(draftForm.logoUrl) ? draftForm.logoUrl.trim() : "",
    bannerImageUrl: isValidImageSrc(draftForm.bannerImageUrl) ? draftForm.bannerImageUrl.trim() : "",
    videoUrl: isVid && isValidVideoSrc(draftForm.videoUrl) ? draftForm.videoUrl.trim() : "",
    websiteUrl: draftForm.websiteUrl.trim(),
    targetPages,
    displayPriority: 15,
    displayFrequency: 1,
    activatedAt: 0,
    expiryAt: 0,
    startDate: "",
    endDate: "",
    renewalOfAdId: renewSourceAd ? renewSourceAd.id : "",
    createdAt: now,
    updatedAt: now
  };

  const payPayload = {
    id: payId,
    adId,
    advertiserId: session.id,
    advertiserBusiness: draftForm.businessName.trim(),
    contactPersonName: draftForm.contactPersonName.trim(),
    packageId: pkg.id,
    packageName: pkg.name,
    adType: pkg.adType || pkg.placementType || "BANNER",
    adPlacement: chosenPlacement,
    adSizeKey: resolvePackageSizeLabel(pkg),
    durationDays,
    isRenewal,
    paymentMethod: payMethod,
    senderMobile: draftForm.senderMobile.trim(),
    transactionId: draftForm.transactionId.trim(),
    transactionIdNormalized: normTrx,
    amountBdt: paid,
    expectedAmountBdt: fixedTotalBdt,
    screenshotUrl: isValidImageSrc(draftForm.screenshotUrl) ? draftForm.screenshotUrl.trim() : "",
    status: "PENDING",
    adminNote: "",
    createdAt: now,
    verifiedAt: 0
  };

  const r1 = await fetch(`${RTDB_BASE}/sponsors/${adId}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(adPayload) });
  const r2 = await fetch(`${RTDB_BASE}/ad_payments/${payId}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payPayload) });
  if (!r1.ok || !r2.ok) return toast(t("জমা দিতে ব্যর্থ হয়েছে। ইন্টারনেট সংযোগ পরীক্ষা করুন।", "Submission failed. Please check internet connection."));

  renewSourceAd = null;
  draftForm.title = "";
  draftForm.description = "";
  draftForm.transactionId = "";
  draftForm.screenshotUrl = "";
  activeTab = "status";
  toast(t("স্পন্সর বিজ্ঞাপন ও পেমেন্ট সফলভাবে জমা হয়েছে! অ্যাডমিন যাচাইয়ের পর এটি চালু হবে।", "Sponsor request & payment submitted! It will activate after Admin verification."));
  await loadPortalData();
}

          <span class="text-[10px] font-extrabold text-teal-800">${t("অ্যাপ ওপেন পপআপ", "App Open Popup")}</span>
          <span class="text-[9px] text-slate-500">${esc(sz)}</span>

  const fixedTotal = selectedPkg ? calculateFixedPackageTotal(selectedPkg.priceBdt) : 0;
  const isVid = selectedPkg ? (draftForm.mediaType === "VIDEO" || isVideoPackage(selectedPkg)) : false;

function buildPreviewHtml() {
  const pkg = getSelectedPackage();
  const title = esc(draftForm.title || t("আপনার বিজ্ঞাপনের শিরোনাম", "Your Advertisement Title"));
  const biz = esc(draftForm.businessName || session?.businessName || t("প্রতিষ্ঠানের নাম", "Business Name"));
  const desc = esc(draftForm.description || t("বিজ্ঞাপনের সংক্ষিপ্ত বিবরণ এখানে দেখানো হবে।", "Your promotional message will appear here."));
  const hasImg = isValidImageSrc(draftForm.bannerImageUrl);
  const hasVid = isValidVideoSrc(draftForm.videoUrl);
  const sizeLbl = pkg ? resolvePackageSizeLabel(pkg) : "300×200 px";
  const placeObj = PLACEMENT_OPTIONS.find(o => o.key === draftForm.selectedPlacement);
  const placeLbl = placeObj ? t(placeObj.labelBn, placeObj.labelEn) : draftForm.selectedPlacement;
  const rate = pkg ? calculateFixedPackageTotal(pkg.priceBdt) : 0;

  return `
    <div class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] bg-white px-3 py-2 rounded-xl border border-slate-200">
        <span class="font-bold text-sky-900">${esc(pkg ? pkg.name : "Package")} &bull; ${esc(placeLbl)}</span>
        <span class="px-2 py-0.5 rounded bg-teal-100 text-teal-800 font-bold">${esc(sizeLbl)}</span>
      </div>

      <div class="bg-white rounded-2xl border-2 border-teal-200 overflow-hidden shadow-sm">
        <div class="p-3 bg-teal-50/60 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="text-xs font-bold text-slate-900 truncate">${biz}</div>
            <div class="text-[11px] font-semibold text-sky-800 truncate">${title}</div>
          </div>
          <span class="px-2 py-0.5 rounded bg-teal-600 text-white text-[10px] font-bold flex-shrink-0">${t("স্পন্সরড", "Sponsored")}</span>
        </div>

        ${draftForm.mediaType === "VIDEO" && hasVid ? `
          <video src="${esc(draftForm.videoUrl)}" controls muted class="w-full h-40 object-cover bg-slate-900"></video>
        ` : hasImg ? `
          <img src="${esc(draftForm.bannerImageUrl)}" class="w-full h-36 object-cover" alt="" />
        ` : `
          <div class="h-28 bg-slate-200 flex flex-col items-center justify-center text-xs text-slate-500">
            <span class="font-bold">${esc(sizeLbl)}</span>
            <span class="text-[11px]">${draftForm.mediaType === "VIDEO" ? t("ভিডিও প্রিভিউ", "Video Preview") : t("ছবি প্রিভিউ", "Image Preview")}</span>
          </div>
        `}

        <div class="p-3 space-y-2">
          <p class="text-[11px] text-slate-600">${desc}</p>
          <div class="flex gap-2">
            <div class="flex-1 py-1.5 rounded-lg bg-sky-600 text-white text-center text-[11px] font-bold">${t("ভিজিট করুন", "Visit Sponsor")}</div>

        <span>${t("ফিক্সড মূল্য", "Fixed Price")}: <strong class="text-teal-800">&#2547;${rate.toLocaleString()}</strong></span>
        <span>${t("মেয়াদ", "Duration")}: <strong>${Number(pkg?.durationDays || 30)} ${t("দিন", "Days")}</strong></span>
      </div>
    </div>
  `;
}

function renderStatusView() {
  const ads = portalData.myAds;
  const activeCount = ads.filter(a => effectiveStatus(a) === "ACTIVE").length;
  const pendingCount = ads.filter(a => ["PENDING", "PAYMENT_PENDING"].includes(effectiveStatus(a))).length;
  const expiredCount = ads.filter(a => effectiveStatus(a) === "EXPIRED").length;

  return `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
      <div class="bg-white p-4 rounded-2xl border border-slate-200"><div class="text-xs text-slate-500">${t("মোট আবেদন", "Total Requests")}</div><div class="text-2xl font-extrabold text-slate-900 mt-1">${ads.length}</div></div>
      <div class="bg-white p-4 rounded-2xl border border-emerald-200"><div class="text-xs text-emerald-700 font-semibold">${t("সক্রিয় ক্যাম্পেইন", "Active Campaigns")}</div><div class="text-2xl font-extrabold text-emerald-700 mt-1">${activeCount}</div></div>
      <div class="bg-white p-4 rounded-2xl border border-amber-200"><div class="text-xs text-amber-700 font-semibold">${t("পেন্ডিং / যাচাই", "Pending Review")}</div><div class="text-2xl font-extrabold text-amber-700 mt-1">${pendingCount}</div></div>
      <div class="bg-white p-4 rounded-2xl border border-orange-200"><div class="text-xs text-orange-700 font-semibold">${t("মেয়াদোত্তীর্ণ", "Expired")}</div><div class="text-2xl font-extrabold text-orange-700 mt-1">${expiredCount}</div></div>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
        <h3 class="font-bold text-base text-slate-900">${t("আপনার বিজ্ঞাপন আবেদনের অবস্থা", "Your Sponsor Application Status")}</h3>
        <button onclick="renewSourceAd=null;activeTab='packages';render()" class="px-4 py-2 rounded-xl bg-sky-600 text-white text-xs font-bold">${t("+ নতুন প্যাকেজ বুকিং", "+ Book New Package")}</button>
      </div>
      ${ads.length === 0 ? `
        <div class="p-8 text-center rounded-2xl bg-slate-50 border border-dashed border-slate-300 text-sm text-slate-500">
          ${t("এখনো কোনো বিজ্ঞাপন আবেদন জমা দেওয়া হয়নি।", "You have not submitted any sponsor requests yet.")}
        </div>
      ` : `
        <div class="space-y-3">
          ${ads.map(ad => {
            const st = effectiveStatus(ad);
            const rem = remainingDays(ad);
            return `
              <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50/70 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-start gap-3">
                  <div class="w-20 h-14 rounded-xl bg-sky-100 overflow-hidden flex-shrink-0 border border-slate-200 flex items-center justify-center">
                    ${isValidImageSrc(ad.bannerImageUrl)
                      ? `<img src="${esc(ad.bannerImageUrl)}" class="w-full h-full object-cover" alt="" />`
                      : `<span class="text-[10px] font-bold text-sky-700">${ad.mediaType === "VIDEO" ? "VIDEO" : "AD"}</span>`}
                  </div>
                  <div class="space-y-1">
                    <div class="flex flex-wrap items-center gap-2">
                      <strong class="text-sm text-slate-900">${esc(ad.promoTitle || ad.name)}</strong>
                      ${statusBadge(st)}
                    </div>
                    <div class="text-xs text-slate-600">
                      ${esc(ad.packageName || ad.placementType)} &bull; ${esc(ad.adSizeKey || `${ad.widthPx || 300}×${ad.heightPx || 200}`)} &bull; ${Number(ad.durationDays || 30)} ${t("দিন", "Days")} &bull; <strong class="text-teal-700">&#2547;${Number(ad.priceBdt || 0).toLocaleString()}</strong>
                    </div>
                    <div class="text-[11px] text-slate-500">
                      ${t("শুরু", "Start")}: ${formatDate(ad.activatedAt)} &bull; ${t("মেয়াদ শেষ", "Expiry")}: ${formatDate(ad.expiryAt)}
                      ${st === "ACTIVE" ? ` &bull; <strong class="text-emerald-700">${rem} ${t("দিন বাকি", "day(s) left")}</strong>` : ""}
                    </div>
                  </div>
                </div>
                ${st === "EXPIRED" ? `
                  <button onclick="startRenewAd('${esc(ad.id)}')" class="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold whitespace-nowrap">
                    ${t("পুনরায় চালু (Renew)", "Renew Package")}
                  </button>
                ` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `}
    </div>
  `;
}

function renderPaymentsView() {
  const pays = portalData.myPayments;
  return `
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
      <h3 class="font-bold text-base text-slate-900 mb-4">${t("আপনার পেমেন্ট ইতিহাস", "Your Payment History")} (${pays.length})</h3>
      ${pays.length === 0 ? `<div class="text-sm text-slate-400">${t("কোনো পেমেন্ট রেকর্ড নেই।", "No payment history yet.")}</div>` : `
        <div class="space-y-3">
          ${pays.map(p => `
            <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50/70 flex flex-wrap items-center justify-between gap-3 text-xs">
              <div>
                <div class="flex items-center gap-2">
                  <strong class="text-sm text-slate-900">&#2547;${Number(p.amountBdt || 0).toLocaleString()} (${esc(p.paymentMethod)})</strong>
                  ${statusBadge(p.status || "PENDING")}
                </div>
                <div class="text-slate-600 mt-1">TrxID: <strong>${esc(p.transactionId)}</strong> &bull; ${esc(p.packageName)} &bull; ${t("প্রেরক", "Sender")}: ${esc(p.senderMobile)}</div>
                ${p.adminNote ? `<div class="text-slate-500 mt-0.5">${t("অ্যাডমিন নোট", "Admin Note")}: ${esc(p.adminNote)}</div>` : ""}
              </div>
              <div class="text-slate-400">${formatDate(p.createdAt)}</div>
            </div>
          `).join("")}
        </div>
      `}
    </div>
  `;
}

render();
loadPortalData();
</script>
</body>
</html>
