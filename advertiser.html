function parseSizeOverridesObj(card) {
  if (card?.sizeRateOverrides && typeof card.sizeRateOverrides === "object") return card.sizeRateOverrides;
  try { return JSON.parse(card?.sizeRateOverridesJson || "{}") || {}; } catch (_) { return {}; }
}

function calculatePlacementRateJs(card, adSizeKey, durationDays) {
  const days = Math.max(1, Number(durationDays || 30));
  let baseRate = 0;
  if (days === 1) baseRate = Number(card.dailyRateBdt || 0);
  else if (days === 7) baseRate = Number(card.sevenDaysRateBdt || 0);
  else if (days === 15) baseRate = Number(card.fifteenDaysRateBdt || 0);
  else if (days === 30) baseRate = Number(card.thirtyDaysRateBdt || 0);
  else {
    baseRate = Number(card.customDailyRateBdt || 0) > 0
      ? days * Number(card.customDailyRateBdt)
      : Math.ceil((Number(card.thirtyDaysRateBdt || 0) / 30) * days);
  }
  const overrides = parseSizeOverridesObj(card);
  const norm = String(adSizeKey || "").trim().toUpperCase();
  const ov = Number(overrides[norm] || overrides[adSizeKey] || 0);
  if (ov > 0) {
    if (days === 30) return ov;
    const t30 = Number(card.thirtyDaysRateBdt || 0);
    return t30 > 0 ? Math.max(1, Math.round(baseRate * (ov / t30))) : Math.max(1, Math.ceil((ov / 30) * days));
  }
  return Math.max(0, baseRate);
}

function getEffectiveDays() {
  if (Number(draftForm.durationPreset) > 0) return Number(draftForm.durationPreset);
  return portalData.rateCardSettings.allowCustomDuration ? Math.max(1, parseInt(draftForm.customDays, 10) || 1) : 30;
}

function getSelectedRateCards() {
  const sel = new Set((draftForm.selectedPlacementIds || []).map(s => String(s).toUpperCase()));
  return portalData.rateCards.filter(c => sel.has(c.placementId.toUpperCase()) && String(c.status || "ACTIVE").toUpperCase() === "ACTIVE");
}

function getAllowedSizesForSelection(cards) {
  if (!cards.length) return AD_SIZE_FORMATS;
  const sets = cards.map(c => new Set(String(c.allowedSizesCsv || "").split(",").map(s => s.trim().toUpperCase()).filter(Boolean)));
  let inter = new Set(sets[0]);
  for (let i = 1; i < sets.length; i++) {
    inter = new Set([...inter].filter(x => sets[i].has(x)));
  }
  const union = new Set();
  sets.forEach(s => s.forEach(x => union.add(x)));
  const finalSet = inter.size > 0 ? inter : union;
  return AD_SIZE_FORMATS.filter(f => finalSet.has(f.key.toUpperCase()));
}

function calculateBookingQuote() {
  const cards = getSelectedRateCards();
  const days = getEffectiveDays();
  const lines = cards.map(c => ({
    placementId: c.placementId,
    placementNameEn: c.placementNameEn,
    placementNameBn: c.placementNameBn,
    moduleName: c.moduleName,
    priceBdt: calculatePlacementRateJs(c, draftForm.adSizeKey, days)
  }));
  const subtotalBdt = lines.reduce((s, l) => s + l.priceBdt, 0);
  const cfg = portalData.rateCardSettings;
  let discountPct = 0;
  if (cfg.bundleEnabled && lines.length >= 2) {
    if (lines.length === 2) discountPct = Number(cfg.discount2Pct || 0);
    else if (lines.length === 3) discountPct = Number(cfg.discount3Pct || 0);
    else discountPct = Number(cfg.discount4PlusPct || 0);
  }
  discountPct = Math.max(0, Math.min(80, discountPct));
  const discountBdt = Math.floor((subtotalBdt * discountPct) / 100);
  const totalBdt = Math.max(0, subtotalBdt - discountBdt);
  const breakdownMap = {};
  lines.forEach(l => {
    breakdownMap[l.placementId] = (subtotalBdt > 0 && discountBdt > 0)
      ? Math.round((l.priceBdt * totalBdt) / subtotalBdt)
      : l.priceBdt;
  });
  return { lines, subtotalBdt, discountPct, discountBdt, totalBdt, breakdownMap };
}

function syncExpectedAmount() {
  if (draftForm.bookingMode === "PLACEMENT") {
    draftForm.amountBdt = String(calculateBookingQuote().totalBdt);
  } else {

    if (pk) draftForm.amountBdt = String(pk.priceBdt);
  }
}

// SHA-256(salt:password) — 100% identical to Android AdvertiserRemoteService
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

function generateSaltHex() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
}

function normalizeMobile(raw) {
  const digits = String(raw || "").replace(/[^0-9]/g, "");
  return digits.length >= 11 ? digits.slice(-11) : digits;
}

function isValidBdMobile(raw) {
  return /^01[3-9]\d{8}$/.test(normalizeMobile(raw));
}

function normalizeTrx(raw) {
  return String(raw || "").trim().toUpperCase().replace(/\s+/g, "");
}

function isValidImageSrc(url) {
  const c = String(url || "").trim();
  return c.startsWith("https://") || /^data:image\/(png|jpeg|jpg|webp);base64,/i.test(c);
}

function isValidWebUrl(url) {
  const c = String(url || "").trim();
  return !c || /^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(c);
}

function formatDate(ms) {
  const n = Number(ms || 0);
  return n > 0 ? new Date(n).toISOString().slice(0, 10) : "—";
}

function effectiveStatus(ad) {
  const raw = String(ad.status || "PENDING_APPROVAL").toUpperCase();
  if (raw === "ACTIVE" && Number(ad.expiryAt || 0) > 0 && Date.now() > Number(ad.expiryAt)) return "EXPIRED";
  return raw;
}

function remainingDays(ad) {
  if (effectiveStatus(ad) !== "ACTIVE") return 0;
  const exp = Number(ad.expiryAt || 0);
  if (!exp) return Number(ad.durationDays || 0);
  const diff = exp - Date.now();
  return diff <= 0 ? 0 : Math.ceil(diff / 86400000);
}

function badge(status) {
  const map = {
    ACTIVE: "bg-emerald-100 text-emerald-800",
    VERIFIED: "bg-emerald-100 text-emerald-800",
    PENDING: "bg-amber-100 text-amber-800",
    PENDING_PAYMENT: "bg-amber-100 text-amber-800",
    PENDING_APPROVAL: "bg-amber-100 text-amber-800",
    EXPIRED: "bg-orange-100 text-orange-800",
    REJECTED: "bg-rose-100 text-rose-800",
    PAUSED: "bg-slate-200 text-slate-700"
  };
  return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${map[status] || "bg-slate-100 text-slate-700"}">${esc(status)}</span>`;
}

// --- LOAD DASHBOARD DATA (STRICTLY ISOLATED TO AUTHENTICATED ADVERTISER) ---
async function loadPortalData() {
  if (!session) return;
  try {
    const res = await fetch(`${RTDB_BASE}.json`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const root = (await res.json()) || {};

    portalData.packages = Object.entries(root.ad_packages || {})
      .map(([id, p]) => ({ id, ...p }))
      .filter(p => String(p.status || "ACTIVE").toUpperCase() === "ACTIVE")
      .sort((a, b) => Number(a.priceBdt || 0) - Number(b.priceBdt || 0));

    // Merge rate cards
    const cloudRc = root.placement_rate_cards || {};
    const cloudById = {};
    for (const [k, v] of Object.entries(cloudRc)) {
      if (!v) continue;
      const pid = String(v.placementId || k).toUpperCase();
      cloudById[pid] = { ...v, placementId: v.placementId || k };
    }
    const mergedCards = DEFAULT_PLACEMENT_CATALOG.map(d => cloudById[d.placementId.toUpperCase()] || { ...d });
    const known = new Set(mergedCards.map(c => c.placementId.toUpperCase()));
    Object.values(cloudById).forEach(v => {
      if (!known.has(String(v.placementId).toUpperCase())) mergedCards.push(v);
    });
    mergedCards.sort((a, b) => (Number(a.sortOrder || 99) - Number(b.sortOrder || 99)) || String(a.placementId).localeCompare(String(b.placementId)));
    portalData.rateCards = mergedCards;

    if (root.rate_card_settings) {
      portalData.rateCardSettings = { ...portalData.rateCardSettings, ...root.rate_card_settings };
    }
    if (root.payment_settings) {
      portalData.paymentSettings = { ...portalData.paymentSettings, ...root.payment_settings };
    }

    // Active placement slot counts
    const counts = {};
    const allSponsorsRaw = Object.entries(root.sponsors || {}).map(([id, s]) => ({ id, ...s }));
    allSponsorsRaw.forEach(sp => {
      if (effectiveStatus(sp) !== "ACTIVE" || sp.isActive === false) return;
      String(sp.placementIds || "").split(",").map(s => s.trim().toUpperCase()).filter(Boolean).forEach(pid => {
        counts[pid] = (counts[pid] || 0) + 1;
      });
    });
    portalData.activePlacementCounts = counts;

    const totals = root.ad_analytics?.totals || {};
    portalData.myAds = allSponsorsRaw
      .map(s => ({
        ...s,
        totalViews: Number(totals[s.id]?.totalImpressions ?? s.totalViews ?? 0),
        uniqueViews: Number(totals[s.id]?.uniqueViews ?? s.uniqueViews ?? 0),
        clicks: Number(totals[s.id]?.clicks ?? 0)
      }))
      .filter(s => s.advertiserId === session.id)
      .sort((a, b) => Number(b.updatedAt || 0) - Number(a.updatedAt || 0));

    portalData.myPayments = Object.entries(root.ad_payments || {})
      .map(([id, p]) => ({ id, ...p }))
      .filter(p => p.advertiserId === session.id)
      .sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));

    if (!draftForm.businessName) draftForm.businessName = session.businessName || "";
    if (!draftForm.contactNumber) draftForm.contactNumber = session.mobile || "";
    if (!draftForm.senderMobile) draftForm.senderMobile = session.mobile || "";
    if (!draftForm.packageId && portalData.packages.length > 0) draftForm.packageId = portalData.packages[0].id;
    syncExpectedAmount();
    render();
  } catch (err) {
    toast("Sync error: " + err.message);
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const businessName = document.getElementById("reg_biz").value.trim();
  const ownerName = document.getElementById("reg_owner").value.trim();
  const mobile = document.getElementById("reg_mobile").value.trim();
  const email = document.getElementById("reg_email").value.trim().toLowerCase();
  const address = document.getElementById("reg_address").value.trim();
  const password = document.getElementById("reg_pass").value;

  if (!isValidBdMobile(mobile)) return toast(t("সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)", "Enter a valid Bangladesh mobile number (01XXXXXXXXX)"));
  if (password.length < 6) return toast(t("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে", "Password must be at least 6 characters"));

  const existingRes = await fetch(`${RTDB_BASE}/advertisers.json`);
  const existing = (existingRes.ok ? await existingRes.json() : {}) || {};
  const norm = normalizeMobile(mobile);
  for (const adv of Object.values(existing)) {
    if (adv && normalizeMobile(adv.mobile) === norm) {
      return toast(t("এই মোবাইল নম্বর দিয়ে আগেই অ্যাকাউন্ট তৈরি করা হয়েছে!", "An account with this mobile number already exists."));
    }
  }

  const id = uid("adv");
  const salt = generateSaltHex();
  const passwordHash = await sha256Hex(`${salt}:${password}`);
  const now = Date.now();
  const record = { id, businessName, ownerName, mobile, email, address, salt, passwordHash, status: "ACTIVE", createdAt: now, updatedAt: now };

  const putRes = await fetch(`${RTDB_BASE}/advertisers/${id}.json`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(record)
  });
  if (!putRes.ok) return toast("Registration failed. Please try again.");

  session = { id, businessName, ownerName, mobile, email, address };
  sessionStorage.setItem("dlbd_adv_session", JSON.stringify(session));
  toast(t("অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!", "Advertiser account created successfully!"));
  await loadPortalData();
}

async function handleLogin(e) {
  e.preventDefault();
  const identifier = document.getElementById("log_id").value.trim();
  const password = document.getElementById("log_pass").value;

  const res = await fetch(`${RTDB_BASE}/advertisers.json`);
  const all = (res.ok ? await res.json() : {}) || {};
  const normMob = normalizeMobile(identifier);
  const lowId = identifier.toLowerCase();

  let found = null;
  for (const [id, adv] of Object.entries(all)) {
    if (!adv) continue;
    if ((normMob && normalizeMobile(adv.mobile) === normMob) || (adv.email && adv.email.toLowerCase() === lowId)) {
      found = { id, ...adv };
      break;
    }
  }
  if (!found) return toast(t("অ্যাকাউন্ট পাওয়া যায়নি!", "Advertiser account not found."));
  if (String(found.status || "ACTIVE").toUpperCase() !== "ACTIVE") {
    return toast(t("আপনার অ্যাকাউন্টটি অ্যাডমিন কর্তৃক স্থগিত করা হয়েছে।", "This advertiser account is suspended by admin."));
  }
  const hash = await sha256Hex(`${found.salt}:${password}`);
  if (hash !== found.passwordHash) return toast(t("ভুল পাসওয়ার্ড!", "Incorrect password."));

  session = { id: found.id, businessName: found.businessName, ownerName: found.ownerName, mobile: found.mobile, email: found.email || "", address: found.address || "" };
  sessionStorage.setItem("dlbd_adv_session", JSON.stringify(session));
  toast(t("সফলভাবে লগইন হয়েছে!", "Logged in successfully!"));
  await loadPortalData();
}

function handleUploadImage(event, fieldName) {
  const file = event.target.files?.[0];
  if (!file) return;
  if (!["image/png", "image/jpeg", "image/webp"].includes(file.type)) {
    toast(t("শুধুমাত্র PNG, JPEG বা WebP ছবি অনুমোদিত।", "Only PNG, JPEG, or WebP images are allowed."));
    event.target.value = "";
    return;
  }
  if (file.size > 3 * 1024 * 1024) {
    toast(t("ছবির সাইজ ৩ এমবি-র কম হতে হবে।", "Image size must be under 3 MB."));
    event.target.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let dataUrl = reader.result;
      const w = img.naturalWidth, h = img.naturalHeight;
      if (w > 1080 || file.size > 350000) {
        const scale = w > 1080 ? 1080 / w : 1;
        const c = document.createElement("canvas");
        c.width = Math.round(w * scale);
        c.height = Math.round(h * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        dataUrl = c.toDataURL("image/jpeg", 0.84);
      }
      draftForm[fieldName] = dataUrl;
      if (fieldName === "bannerImageUrl") {
        draftForm.imgWidth = w;
        draftForm.imgHeight = h;
      }
      toast(t(`ছবি যাচাই সম্পন্ন (${w}×${h}px)`, `Image validated (${w}×${h}px)`));
      render();
    };
    img.onerror = () => toast("Invalid or corrupted image file.");
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

async function handleSubmitAdAndPayment(e) {
  e.preventDefault();
  if (!draftForm.title.trim() || draftForm.title.trim().length < 3) return toast(t("বিজ্ঞাপনের শিরোনাম দিন", "Advertisement title is required."));
  if (!isValidImageSrc(draftForm.bannerImageUrl)) return toast(t("বৈধ বিজ্ঞাপন ছবি আপলোড করুন অথবা HTTPS URL দিন", "Upload a valid ad image or enter an HTTPS image URL."));
  if (!isValidWebUrl(draftForm.websiteUrl)) return toast(t("ওয়েবসাইট URL https:// দিয়ে শুরু হতে হবে", "Website URL must start with https:// or http://"));
  if (!isValidBdMobile(draftForm.senderMobile)) return toast(t("সঠিক বিকাশ/নগদ প্রেরক মোবাইল নম্বর দিন", "Enter a valid sender bKash/Nagad mobile number."));

  const normTrx = normalizeTrx(draftForm.transactionId);
  if (normTrx.length < 5) return toast(t("সঠিক Transaction ID (TrxID) দিন", "Enter a valid Transaction ID (TrxID)."));
  const paid = parseInt(draftForm.amountBdt, 10) || 0;

  let pkgId = "", pkgName = "", widthPx = 300, heightPx = 200, durationDays = 30, priceBdt = 0;
  let placementType = "BANNER_300x200", targetPages = "ALL";
  let placementIdsCsv = "", moduleNamesCsv = "", adSizeKey = "", placementBreakdown = {}, subtotalBdt = 0, bundleDiscountBdt = 0;

  if (draftForm.bookingMode === "PLACEMENT") {
    const cards = getSelectedRateCards();
    if (!cards.length) return toast(t("অন্তত ১টি সক্রিয় প্লেসমেন্ট নির্বাচন করুন", "Select at least one active placement."));
    durationDays = getEffectiveDays();
    adSizeKey = draftForm.adSizeKey || "300x200";
    const spec = AD_SIZE_FORMATS.find(f => f.key.toUpperCase() === adSizeKey.toUpperCase()) || AD_SIZE_FORMATS[2];
    widthPx = adSizeKey === "CUSTOM" ? Math.max(120, parseInt(draftForm.customWidthPx, 10) || 300) : spec.w;
    heightPx = adSizeKey === "CUSTOM" ? Math.max(40, parseInt(draftForm.customHeightPx, 10) || 200) : spec.h;

    const quote = calculateBookingQuote();
    priceBdt = quote.totalBdt;
    subtotalBdt = quote.subtotalBdt;
    bundleDiscountBdt = quote.discountBdt;
    placementBreakdown = quote.breakdownMap;
    if (paid < priceBdt) {
      return toast(t(`মোট মূল্য কমপক্ষে ৳${priceBdt} হতে হবে`, `Paid amount must be at least calculated total ৳${priceBdt}.`));
    }
    placementIdsCsv = cards.map(c => c.placementId).join(",");
    moduleNamesCsv = Array.from(new Set(cards.map(c => c.moduleName))).join(",");
    pkgId = "placement_" + placementIdsCsv.slice(0, 40);
    pkgName = cards.map(c => c.placementNameEn).join(" + ") + ` (${adSizeKey} • ${durationDays}d)`;
    if (cards.some(c => c.placementId === "OTH-POPUP")) placementType = "POPUP_AD";
    else if (cards.some(c => c.placementId === "OTH-ABOUT")) placementType = "ABOUT_US_SPONSOR";
    else if (adSizeKey === "RESPONSIVE") placementType = "SPONSORED_NATIVE_CARD";
    else if (adSizeKey === "320x100") placementType = "BANNER_320x100";
    else if (adSizeKey === "CUSTOM") placementType = "BANNER_CUSTOM";
  } else {
    const pkg = portalData.packages.find(p => p.id === draftForm.packageId);
    if (!pkg) return toast(t("একটি বিজ্ঞাপন প্যাকেজ নির্বাচন করুন", "Please select an advertising package."));
    pkgId = pkg.id; pkgName = pkg.name; widthPx = pkg.widthPx; heightPx = pkg.heightPx;
    durationDays = pkg.durationDays; priceBdt = Number(pkg.priceBdt || 0);
    subtotalBdt = priceBdt; placementType = pkg.placementType;
    targetPages = pkg.placementType === "ABOUT_US_SPONSOR" ? "about_us" : "ALL";
    if (paid < priceBdt) {
      return toast(t(`প্যাকেজ মূল্য কমপক্ষে ৳${priceBdt} হতে হবে`, `Paid amount must be at least ৳${priceBdt}.`));
    }
  }

  // Strict Duplicate TrxID Check across RTDB
  const payRes = await fetch(`${RTDB_BASE}/ad_payments.json`);
  const allPay = (payRes.ok ? await payRes.json() : {}) || {};
  for (const p of Object.values(allPay)) {
    if (!p || String(p.status).toUpperCase() === "REJECTED") continue;
    if (normalizeTrx(p.transactionIdNormalized || p.transactionId) === normTrx) {
      return toast(t(`এই TrxID (${draftForm.transactionId}) ইতিপূর্বে ব্যবহৃত হয়েছে!`, `Duplicate Transaction ID (${draftForm.transactionId}) already exists!`));
    }
  }

  const now = Date.now();
  const adId = uid("sp");
  const payId = uid("pay");
  const isRenewal = Boolean(renewSourceAd);

  // Ad ALWAYS starts PENDING_APPROVAL (NEVER active until Admin verifies payment)
  const adPayload = {
    id: adId,
    advertiserId: session.id,
    submittedBy: "ADVERTISER",
    packageId: pkgId,
    packageName: pkgName,
    placementIds: placementIdsCsv,
    moduleNames: moduleNamesCsv,
    adSizeKey,
    placementBreakdown,
    subtotalBdt,
    bundleDiscountBdt,
    widthPx,
    heightPx,
    durationDays,
    priceBdt,
    placementType,
    status: "PENDING_APPROVAL",
    isActive: false,
    name: draftForm.businessName.trim(),
    sponsorName: draftForm.businessName.trim(),
    promoTitle: draftForm.title.trim(),
    title: draftForm.title.trim(),
    description: draftForm.description.trim(),
    logoUrl: draftForm.logoUrl.trim(),
    bannerImageUrl: draftForm.bannerImageUrl.trim(),
    websiteUrl: draftForm.websiteUrl.trim(),
    contactNumber: draftForm.contactNumber.trim(),
    targetPages,
    displayPriority: 15,
    displayFrequency: 1,
    activatedAt: 0,
    expiryAt: 0,
    startDate: "",
    endDate: "",
    renewalOfAdId: renewSourceAd ? renewSourceAd.id : "",
    totalViews: 0,
    uniqueViews: 0,
    createdAt: now,
    updatedAt: now
  };

  const payPayload = {
    id: payId,
    adId,
    advertiserId: session.id,
    advertiserBusiness: session.businessName || draftForm.businessName.trim(),
    packageId: pkgId,
    packageName: pkgName,
    placementIds: placementIdsCsv,
    moduleNames: moduleNamesCsv,
    adSizeKey,
    placementBreakdown,
    subtotalBdt,
    bundleDiscountBdt,
    isRenewal,
    paymentMethod: draftForm.paymentMethod,
    senderMobile: draftForm.senderMobile.trim(),
    transactionId: draftForm.transactionId.trim(),
    transactionIdNormalized: normTrx,
    amountBdt: paid,
    screenshotUrl: draftForm.screenshotUrl.trim(),
    status: "PENDING",
    adminNote: "",
    createdAt: now,
    verifiedAt: 0
  };

  const r1 = await fetch(`${RTDB_BASE}/sponsors/${adId}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(adPayload) });
  const r2 = await fetch(`${RTDB_BASE}/ad_payments/${payId}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payPayload) });
  if (!r1.ok || !r2.ok) return toast("Submission failed. Please check internet connection.");

  renewSourceAd = null;
  draftForm.title = "";
  draftForm.description = "";
  draftForm.transactionId = "";
  draftForm.screenshotUrl = "";
  activeTab = "dashboard";
  toast(t("বিজ্ঞাপন ও পেমেন্ট সফলভাবে জমা হয়েছে! অ্যাডমিন যাচাইয়ের পর এটি স্বয়ংক্রিয়ভাবে চালু হবে।", "Booking & payment submitted! It will automatically activate after Admin verification."));
  await loadPortalData();
}

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">${t("বিজ্ঞাপনের ছবি আপলোড (PNG/JPG/WebP) *", "Upload Ad Image *")}</label>
              <input type="file" accept="image/png,image/jpeg,image/webp" onchange="handleUploadImage(event, 'bannerImageUrl')" class="text-xs w-full mb-1.5" />
              <input value="${esc(draftForm.bannerImageUrl.startsWith('data:') ? '' : draftForm.bannerImageUrl)}" oninput="draftForm.bannerImageUrl=this.value;refreshPortalPreview()" placeholder="Or paste https://... image URL" class="input text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">${t("লোগো (ঐচ্ছিক)", "Logo (Optional)")}</label>
              <input type="file" accept="image/png,image/jpeg,image/webp" onchange="handleUploadImage(event, 'logoUrl')" class="text-xs w-full mb-1.5" />
              <input value="${esc(draftForm.logoUrl.startsWith('data:') ? '' : draftForm.logoUrl)}" oninput="draftForm.logoUrl=this.value;refreshPortalPreview()" placeholder="Or paste https://... logo URL" class="input text-xs" />
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">${t("ওয়েবসাইট / ফেসবুক লিংক", "Website / Social URL")}</label><input type="url" value="${esc(draftForm.websiteUrl)}" oninput="draftForm.websiteUrl=this.value" placeholder="https://..." class="input text-xs" /></div>
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">${t("যোগাযোগের নম্বর", "Contact Number")}</label><input value="${esc(draftForm.contactNumber)}" oninput="draftForm.contactNumber=this.value;refreshPortalPreview()" placeholder="01XXXXXXXXX" class="input text-xs" /></div>
          </div>
        </div>

        <!-- STEP 8 & 9: Payment & Submit -->
        <div class="space-y-3 pt-3 border-t border-slate-100">
          <div class="text-xs font-bold text-slate-700">${t("৮ ও ৯. পেমেন্ট তথ্য জমা ও বুকিং সাবমিট", "8 & 9. Payment Info & Booking Submit")}</div>
          <div class="p-4 rounded-2xl bg-sky-50 border border-sky-200 text-xs space-y-1.5">
            <div><strong class="text-pink-700">bKash (${esc(ps.bkashAccountType)}):</strong> ${esc(ps.bkashNumber || "Contact Admin")}</div>
            <div><strong class="text-orange-700">Nagad (${esc(ps.nagadAccountType)}):</strong> ${esc(ps.nagadNumber || "Contact Admin")}</div>
            <div class="text-slate-600 pt-1">${esc(lang === "bn" ? (ps.instructionsBn || ps.instructionsEn || "নির্ধারিত মোট টাকা পাঠিয়ে নিচে TrxID জমা দিন। অ্যাডমিন যাচাইয়ের পর বিজ্ঞাপন চালু হবে।") : (ps.instructionsEn || ps.instructionsBn || "Send calculated total via bKash or Nagad and submit TrxID below."))}</div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">${t("পেমেন্ট মাধ্যম *", "Payment Method *")}</label>
              <select onchange="draftForm.paymentMethod=this.value" class="input">
                <option value="BKASH" ${draftForm.paymentMethod==="BKASH"?"selected":""}>bKash</option>
                <option value="NAGAD" ${draftForm.paymentMethod==="NAGAD"?"selected":""}>Nagad</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">${t("প্রদত্ত টাকা (BDT) *", "Amount Paid (BDT) *")}</label>
              <input type="number" required value="${esc(draftForm.amountBdt)}" oninput="draftForm.amountBdt=this.value" class="input" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">${t("প্রেরকের মোবাইল নম্বর *", "Sender Mobile Number *")}</label><input required value="${esc(draftForm.senderMobile)}" oninput="draftForm.senderMobile=this.value" placeholder="01XXXXXXXXX" class="input" /></div>
            <div><label class="block text-xs font-semibold text-slate-600 mb-1">${t("ট্রানজেকশন আইডি (TrxID) *", "Transaction ID (TrxID) *")}</label><input required value="${esc(draftForm.transactionId)}" oninput="draftForm.transactionId=this.value" placeholder="e.g. BKS8X92KLQ" class="input uppercase" /></div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">${t("পেমেন্ট স্ক্রিনশট (ঐচ্ছিক)", "Payment Screenshot (Optional)")}</label>
            <input type="file" accept="image/png,image/jpeg,image/webp" onchange="handleUploadImage(event, 'screenshotUrl')" class="text-xs w-full" />
            ${draftForm.screenshotUrl ? `<div class="text-[11px] text-emerald-700 font-semibold mt-1">${t("স্ক্রিনশট যুক্ত হয়েছে", "Screenshot attached")}</div>` : ""}
          </div>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-sm">
          ${t(`বুকিং রিকোয়েস্ট জমা দিন (৳${draftForm.amountBdt || 0})`, `Submit Booking Request (৳${draftForm.amountBdt || 0})`)}
        </button>
      </form>

      <!-- Visual Screen Placement Preview BEFORE Booking -->
      <div class="xl:col-span-5 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit sticky top-20">
        <h4 class="font-bold text-slate-900 mb-1">${t("বুকিংয়ের পূর্বে প্লেসমেন্ট প্রিভিউ", "Visual Placement Preview Before Booking")}</h4>
        <p class="text-xs text-slate-500 mb-4">${t("অ্যাপের স্ক্রিনে নির্বাচিত স্থানে ও সাইজে আপনার বিজ্ঞাপনটি যেভাবে দেখাবে:", "Exact screen position & size mockup in Doctor List BD:")}</p>
        <div id="portalPreviewBox" class="p-4 rounded-2xl bg-slate-100 border border-dashed border-slate-300">
          ${buildPreviewHtml()}
        </div>
      </div>
    </div>
  `;
}

function buildPreviewHtml() {
  const title = esc(draftForm.title || t("আপনার বিজ্ঞাপনের শিরোনাম", "Your Advertisement Title"));
  const biz = esc(draftForm.businessName || session?.businessName || "Business Name");
  const desc = esc(draftForm.description || t("বিজ্ঞাপনের সংক্ষিপ্ত বিবরণ এখানে দেখানো হবে।", "Your promotional message will appear here."));
  const hasImg = isValidImageSrc(draftForm.bannerImageUrl);
  const cards = getSelectedRateCards();
  const primary = cards[0];
  const pid = primary ? primary.placementId : "HOME-01";
  const spec = AD_SIZE_FORMATS.find(f => f.key.toUpperCase() === draftForm.adSizeKey.toUpperCase()) || AD_SIZE_FORMATS[2];
  const wPx = draftForm.adSizeKey === "CUSTOM" ? (draftForm.customWidthPx || 300) : spec.w;
  const hPx = draftForm.adSizeKey === "CUSTOM" ? (draftForm.customHeightPx || 200) : spec.h;
  const isTop = pid.endsWith("-01") || pid === "HOME-01";
  const isBottom = pid === "HOME-07" || pid.endsWith("-04");

  return `
    <div class="space-y-3">
      <div class="flex items-center justify-between text-[11px] bg-white px-3 py-2 rounded-xl border border-slate-200">
        <span class="font-bold text-sky-900">${esc(pid)} &bull; ${esc(primary ? t(primary.placementNameBn, primary.placementNameEn) : "Placement")}</span>
        <span class="px-2 py-0.5 rounded bg-teal-100 text-teal-800 font-bold">${esc(wPx)}&times;${esc(hPx)}px</span>
      </div>
      <div class="flex gap-3 items-start">
        <div class="w-12 h-24 bg-white rounded-xl border border-slate-200 p-1.5 flex flex-col justify-between flex-shrink-0">
          <div class="h-3 rounded ${isTop ? 'bg-teal-500' : 'bg-slate-200'}"></div>
          <div class="h-7 rounded ${(!isTop && !isBottom) ? 'bg-teal-500' : 'bg-slate-200'}"></div>
          <div class="h-3 rounded ${isBottom ? 'bg-teal-500' : 'bg-slate-200'}"></div>
        </div>
        <div class="flex-1 bg-white rounded-2xl border-2 border-teal-200 overflow-hidden shadow-sm">
          <div class="p-2.5 bg-teal-50/50 flex items-center justify-between">
            <div>
              <div class="text-xs font-bold text-slate-900">${biz}</div>
              <div class="text-[11px] font-semibold text-sky-800">${title}</div>
            </div>
            <span class="px-2 py-0.5 rounded bg-teal-600 text-white text-[10px] font-bold">${t("স্পন্সরড", "Sponsored")}</span>
          </div>
          ${hasImg ? `<img src="${esc(draftForm.bannerImageUrl)}" class="w-full h-32 object-cover" alt="" />` : `<div class="h-24 bg-slate-200 flex items-center justify-center text-xs text-slate-500">${esc(wPx)}×${esc(hPx)} Preview</div>`}
          <div class="p-2.5 space-y-1.5">
            <p class="text-[11px] text-slate-600">${desc}</p>
            <div class="flex gap-1.5">
              <div class="flex-1 py-1 rounded-lg bg-sky-600 text-white text-center text-[11px] font-bold">${t("ভিজিট করুন", "Visit Sponsor")}</div>
              ${draftForm.contactNumber ? `<div class="px-2.5 py-1 rounded-lg border border-teal-600 text-teal-700 text-[11px] font-bold">${t("কল", "Call")}</div>` : ""}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function refreshPortalPreview() {
  const el = document.getElementById("portalPreviewBox");
  if (el) el.innerHTML = buildPreviewHtml();
}

function renderPaymentsView() {
  const pays = portalData.myPayments;
  return `
    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
      <h3 class="font-bold text-base text-slate-900 mb-4">${t("আপনার পেমেন্ট ইতিহাস", "Your Payment History")} (${pays.length})</h3>
      ${pays.length === 0 ? `<div class="text-sm text-slate-400">${t("কোনো পেমেন্ট রেকর্ড নেই।", "No payment history yet.")}</div>` : `
        <div class="space-y-3">
          ${pays.map(p => `
            <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50/70 flex flex-wrap items-center justify-between gap-3 text-xs">
              <div>
                <div class="flex items-center gap-2">
                  <strong class="text-sm text-slate-900">&#2547;${Number(p.amountBdt || 0).toLocaleString()} (${esc(p.paymentMethod)})</strong>
                  ${badge(String(p.status || "PENDING").toUpperCase())}
                </div>
                <div class="text-slate-600 mt-1">TrxID: <strong>${esc(p.transactionId)}</strong> &bull; ${esc(p.packageName)} &bull; Sender: ${esc(p.senderMobile)}</div>
                ${p.placementIds ? `<div class="text-[11px] text-sky-800 font-semibold mt-0.5">Placements: ${esc(p.placementIds)} (${esc(p.adSizeKey || "")})</div>` : ""}
                ${p.adminNote ? `<div class="text-slate-500 mt-0.5">Note: ${esc(p.adminNote)}</div>` : ""}
              </div>
              <div class="text-slate-400">${formatDate(p.createdAt)}</div>
            </div>
          `).join("")}
        </div>
      `}
    </div>
  `;
}

render();
if (session) loadPortalData();
</script>
</body>
</html>
