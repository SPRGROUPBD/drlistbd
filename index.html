function to12Hour(time24) {
  if (!time24) return "";
  if (/am|pm/i.test(time24)) return time24.trim().toUpperCase();
  const [hStr, mStr] = time24.split(":");
  let h = parseInt(hStr, 10);
  const m = (mStr || "00").padStart(2, "0");
  if (isNaN(h)) return time24;
  const suffix = h >= 12 ? "PM" : "AM";
  h = h % 12;
  if (h === 0) h = 12;
  return `${h}:${m} ${suffix}`;
}

function to24Hour(timeStr) {
  if (!timeStr) return "08:00";
  const trimmed = timeStr.trim();
  if (/^\d{2}:\d{2}$/.test(trimmed)) return trimmed;
  const match = trimmed.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if (!match) return "08:00";
  let h = parseInt(match[1], 10);
  const m = match[2];
  const mer = match[3].toUpperCase();
  if (mer === "PM" && h < 12) h += 12;
  if (mer === "AM" && h === 12) h = 0;
  return `${String(h).padStart(2, "0")}:${m}`;
}

function slotBadgeStyle(slot) {
  const lbl = (slot.slotLabel || "").toLowerCase();
  const open = (slot.openTime || "").toUpperCase();
  if (lbl.includes("morning") || lbl.includes("সকাল") || open.includes("AM")) {
    return { cls: "bg-amber-50 border-amber-200 text-amber-900", tag: "সকাল • Morning" };
  }
  if (lbl.includes("afternoon") || lbl.includes("বিকাল")) {
    return { cls: "bg-teal-50 border-teal-200 text-teal-900", tag: "বিকাল • Afternoon" };
  }
  return { cls: "bg-sky-50 border-sky-200 text-sky-900", tag: slot.slotLabel || "Custom" };
}

function timeSortMinutes(t) {
  const t24 = to24Hour(t);
  const [h, m] = t24.split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
}

function getDistrictUpazilaMap() {
  const map = {};
  for (const [dist, upzList] of Object.entries(BD_DEFAULT_LOCATIONS)) {
    map[dist] = new Set(upzList);
  }
  Object.values(dbState.locations || {}).forEach(l => {
    const dist = (l.district || "").trim();
    if (!dist) return;
    if (!map[dist]) map[dist] = new Set();
    if (l.upazila && l.upazila.trim()) map[dist].add(l.upazila.trim());
    if (l.area && l.area.trim()) map[dist].add(l.area.trim());
  });
  return map;
}

function getAllAdminFacilities() {
  const hospitals = Object.entries(dbState.hospitals || {}).map(([id, h]) => ({
    id,
    type: "HOSPITAL",
    name: h.nameEn || h.nameBn || "",
    label: h.nameBn && h.nameEn && h.nameBn !== h.nameEn ? `${h.nameEn} (${h.nameBn})` : (h.nameEn || h.nameBn || ""),
    district: h.district || "",
    upazila: h.upazila || ""
  })).filter(x => x.name);

  const diagnostics = Object.entries(dbState.diagnostic_centers || {}).map(([id, d]) => ({
    id,
    type: "DIAGNOSTIC_CENTER",
    name: d.nameEn || d.nameBn || "",
    label: d.nameBn && d.nameEn && d.nameBn !== d.nameEn ? `${d.nameEn} (${d.nameBn})` : (d.nameEn || d.nameBn || ""),

    upazila: d.upazila || ""

  return { hospitals, diagnostics };
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 2800);
}

function uid(prefix) {
  return prefix + "_" + Math.random().toString(36).slice(2, 10);
}

function esc(v) {
  return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

async function loadAllData() {
  document.getElementById("syncStatus").textContent = "Loading from RTDB...";
  try {
    const res = await fetch(`${RTDB_BASE}.json`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data) {
      for (const k of Object.keys(dbState)) {
        if (k === "settings") {
          if (data.settings) dbState.settings = { ...dbState.settings, ...data.settings };
        } else {
          dbState[k] = data[k] || {};
        }
      }
    }
    document.getElementById("syncStatus").textContent = "Synced live with octor-aad88 RTDB (" + new Date().toLocaleTimeString() + ")";
    renderTab();
  } catch (err) {
    document.getElementById("syncStatus").textContent = "RTDB Error: " + err.message + " (Check RTDB Rules allow read/write on /directory)";
    renderTab();
  }
}

async function saveNode(collection, id, obj) {
  const url = id ? `${RTDB_BASE}/${collection}/${id}.json` : `${RTDB_BASE}/${collection}.json`;
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(obj)
  });
  if (!res.ok) throw new Error("Save failed: HTTP " + res.status);
  if (id) dbState[collection][id] = obj;
  else dbState[collection] = obj;
  toast("Saved successfully!");
  renderTab();
}

async function deleteNode(collection, id) {
  if (!confirm("Are you sure you want to delete this item?")) return;
  const res = await fetch(`${RTDB_BASE}/${collection}/${id}.json`, { method: "DELETE" });
  if (!res.ok) { toast("Delete failed"); return; }
  delete dbState[collection][id];
  toast("Deleted successfully!");
  renderTab();
}

async function patchCollectionNodes(collection, entriesMap, successMsg) {
  const res = await fetch(`${RTDB_BASE}/${collection}.json`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(entriesMap)
  });
  if (!res.ok) throw new Error("Batch save failed: HTTP " + res.status);
  for (const [k, v] of Object.entries(entriesMap)) {
    if (v === null) delete dbState[collection][k];
    else dbState[collection][k] = v;
  }
  toast(successMsg || "Saved successfully!");
  renderTab();
}

  const el = document.getElementById("tabContent");

  else if (activeTab === "chambers") el.innerHTML = renderChambers();
  else if (activeTab === "hospitals") el.innerHTML = renderHospitals();
  else if (activeTab === "diagnostics") el.innerHTML = renderDiagnostics();
  else if (activeTab === "specialties") el.innerHTML = renderSpecialties();

  else if (activeTab === "notifications") el.innerHTML = renderNotifications();
  else if (activeTab === "settings") el.innerHTML = renderSettings();
}

function renderDashboard() {
  const docs = Object.values(dbState.doctors);

  const activeChambers = chambers.filter(c => c.isActive !== false).length;
  const stats = [
    ["Total Doctors", docs.length, "text-sky-700"],
    ["Active Chambers", activeChambers, "text-emerald-600"],
    ["Total Chambers", chambers.length, "text-indigo-600"],
    ["Weekly Time Slots", Object.keys(dbState.chamber_schedules).length, "text-teal-700"],
    ["Hospitals", Object.keys(dbState.hospitals).length, "text-sky-600"],
    ["Diagnostic Centers", Object.keys(dbState.diagnostic_centers).length, "text-cyan-700"],
    ["Specialties", Object.keys(dbState.specialties).length, "text-slate-800"],
    ["Custom Locations", Object.keys(dbState.locations).length, "text-amber-700"]
  ];
  return `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      ${stats.map(([label, count, cls]) => `
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <div class="text-3xl font-bold ${cls}">${count}</div>
          <div class="text-xs text-slate-500 mt-1 font-medium">${label}</div>

      <p class="text-sm text-slate-600 leading-relaxed">
        Everything you add, edit, or delete here is saved directly to your Firebase Realtime Database
        (<code>octor-aad88</code>) and automatically synced into the <strong>Doctor List BD</strong> Android app.
        Only <strong>Active Chambers</strong> are visible in the patient app.
      </p>
    </div>
  `;
}

                ${item.subSpecialty ? `<span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-700">${esc(item.subSpecialty)}</span>` : ""}

      `;
      }).join("")}

  `;
}

function previewDoctorPhoto(url) {
  const img = document.getElementById("doc_photo_preview");
  if (!img) return;
  if (/^https?:\/\//.test((url || "").trim())) {
    img.src = url.trim();
    img.classList.remove("hidden");
  } else {
    img.classList.add("hidden");
  }
}

async function submitDoctor(e) {
  e.preventDefault();
  const id = document.getElementById("doc_id").value || uid("doc");
  const photo = document.getElementById("doc_photo").value.trim();
  if (!/^https?:\/\//.test(photo)) return alert("Profile Photo URL is required and must start with http:// or https://");
  const name = document.getElementById("doc_name").value.trim();
  const qualification = document.getElementById("doc_qual").value.trim();
  const mainSpecialtyId = document.getElementById("doc_spec").value;
  const subSpecialty = document.getElementById("doc_subSpec").value.trim();
  const designation = document.getElementById("doc_desig").value.trim();
  const institution = document.getElementById("doc_inst").value.trim();

  if (!name || !qualification || !mainSpecialtyId || !designation || !institution) {
    return alert("Please complete all required fields.");
  }

  const obj = {
    doctorName: name,
    fullNameBn: name,
    fullNameEn: name,
    photoUrl: photo,
    qualification,
    mainSpecialtyId,
    subSpecialty,
    currentDesignation: designation,
    currentHospital: institution,
    isActive: true,
    approvalStatus: "APPROVED",
    bmdcVerified: false,
    isFeatured: false,
    isDemoData: false,
    updatedAt: Date.now()
  };
  editing = {};
  await saveNode("doctors", id, obj);
}

function onScheduleDoctorFilter(docId) {
  scheduleBuilder.doctorFilter = docId;
  const matching = Object.entries(dbState.chambers).filter(([, ch]) => !docId || ch.doctorId === docId);
  scheduleBuilder.chamberId = matching.length === 1 ? matching[0][0] : "";
  renderTab();
}

function setDayPreset(daysArr) {
  scheduleBuilder.selectedDays = [...daysArr];
  renderTab();
}

function toggleScheduleDay(day, singleMode) {
  if (singleMode) {
    scheduleBuilder.selectedDays = [day];
  } else {
    const idx = scheduleBuilder.selectedDays.indexOf(day);
    if (idx >= 0) scheduleBuilder.selectedDays.splice(idx, 1);
    else scheduleBuilder.selectedDays.push(day);
  }
  renderTab();
}

function selectTimeOption(opt) {
  scheduleBuilder.timeOption = opt;
  if (opt === "MORNING") {
    scheduleBuilder.morningStart = "08:00";
    scheduleBuilder.morningEnd = "14:00";
    scheduleBuilder.customLabel = "Morning";
  } else if (opt === "AFTERNOON") {
    scheduleBuilder.afternoonStart = "15:00";
    scheduleBuilder.afternoonEnd = "18:00";
    scheduleBuilder.customLabel = "Afternoon";
  } else if (opt === "BOTH") {
    scheduleBuilder.morningStart = "08:00";
    scheduleBuilder.morningEnd = "14:00";
    scheduleBuilder.afternoonStart = "15:00";
    scheduleBuilder.afternoonEnd = "18:00";
  }
  renderTab();
}

function updateTimePreviews() {
  const mEl = document.getElementById("preview_morning");
  if (mEl) mEl.textContent = `${to12Hour(scheduleBuilder.morningStart)} – ${to12Hour(scheduleBuilder.morningEnd)}`;
  const aEl = document.getElementById("preview_afternoon");
  if (aEl) aEl.textContent = `${to12Hour(scheduleBuilder.afternoonStart)} – ${to12Hour(scheduleBuilder.afternoonEnd)}`;
}

function selectChamberForBuilder(chamberId, doctorId) {
  scheduleBuilder.editingSlotId = "";
  scheduleBuilder.doctorFilter = doctorId;
  scheduleBuilder.chamberId = chamberId;
  renderTab();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startEditSlot(slotId) {
  const s = dbState.chamber_schedules[slotId];
  if (!s) return;
  const open24 = to24Hour(s.openTime);
  const close24 = to24Hour(s.closeTime);
  const isAfternoon = (s.slotLabel || "").toLowerCase().includes("afternoon") ||
    (s.slotLabel || "").includes("বিকাল") ||
    parseInt(open24.split(":")[0], 10) >= 13;

  scheduleBuilder.editingSlotId = slotId;
  scheduleBuilder.doctorFilter = s.doctorId;
  scheduleBuilder.chamberId = s.chamberId;
  scheduleBuilder.selectedDays = [s.dayOfWeek];
  scheduleBuilder.timeOption = isAfternoon ? "AFTERNOON" : "MORNING";
  if (isAfternoon) {
    scheduleBuilder.afternoonStart = open24;
    scheduleBuilder.afternoonEnd = close24;
  } else {
    scheduleBuilder.morningStart = open24;
    scheduleBuilder.morningEnd = close24;
  }
  scheduleBuilder.customLabel = s.slotLabel || "";
  renderTab();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelEditSlot() {
  scheduleBuilder.editingSlotId = "";
  scheduleBuilder.customLabel = "";
  renderTab();
}

async function clearChamberSchedule(chamberId) {
  const toDelete = Object.entries(dbState.chamber_schedules).filter(([, s]) => s.chamberId === chamberId);
  if (!toDelete.length) return;
  if (!confirm(`Clear all ${toDelete.length} weekly time slot(s) for this chamber?`)) return;
  const patch = {};
  toDelete.forEach(([sid]) => { patch[sid] = null; });
  await patchCollectionNodes("chamber_schedules", patch, "Cleared chamber weekly schedule!");
}

async function deleteChamberWithSlots(chamberId) {
  if (!confirm("Delete this chamber and its weekly time slots?")) return;
  const res = await fetch(`${RTDB_BASE}/chambers/${chamberId}.json`, { method: "DELETE" });
  if (!res.ok) { toast("Delete failed"); return; }
  delete dbState.chambers[chamberId];
  const slotPatch = {};
  Object.entries(dbState.chamber_schedules)
    .filter(([, s]) => s.chamberId === chamberId)
    .forEach(([sid]) => { slotPatch[sid] = null; });
  if (Object.keys(slotPatch).length > 0) {
    await patchCollectionNodes("chamber_schedules", slotPatch, "Chamber & slots deleted!");
  } else {
    toast("Chamber deleted!");
    renderTab();
  }
}

async function submitChamber(e) {
  e.preventDefault();
  const id = document.getElementById("ch_id").value || uid("ch");
  const doctorId = document.getElementById("ch_doc").value;
  const facSelect = document.getElementById("ch_fac");
  const facilityName = facSelect.value.trim();
  const facilityType = facSelect.selectedOptions?.[0]?.dataset?.type || "HOSPITAL";
  const chamberName = document.getElementById("ch_name").value.trim();
  const district = document.getElementById("ch_dist").value.trim();
  const upazila = document.getElementById("ch_upz").value.trim();
  const fullAddress = document.getElementById("ch_addr").value.trim();
  const googleMapsUrl = document.getElementById("ch_maps").value.trim();
  const serialPhone = document.getElementById("ch_phone").value.trim();
  const isActive = document.getElementById("ch_active").checked;

  if (!doctorId || !facilityName || !district || !upazila || !fullAddress) {
    return alert("Please complete all required chamber fields.");
  }
  if (googleMapsUrl && !/^https?:\/\//.test(googleMapsUrl)) {
    return alert("Google Map Location must be a valid URL starting with http:// or https://");
  }

  const obj = {
    doctorId,
    facilityName,
    facilityType,
    chamberName,
    district,
    upazila,
    fullAddress,
    serialPhone,
    googleMapsUrl,
    isActive
  };
  editing = {};
  chamberFormState = { district: "", upazila: "", isActive: true };
  scheduleBuilder.doctorFilter = doctorId;
  scheduleBuilder.chamberId = id;
  await saveNode("chambers", id, obj);
}

async function submitFlexibleSchedule(e) {
  e.preventDefault();
  const sb = scheduleBuilder;
  const chId = sb.chamberId || document.getElementById("sch_ch")?.value;
  const ch = dbState.chambers[chId];
  if (!ch) return alert("Please select a doctor's chamber first.");
  if (!sb.selectedDays.length) return alert("Please select at least one weekday.");

  // Edit single existing slot without touching any other slot or doctor
  if (sb.editingSlotId) {
    const isAfternoon = sb.timeOption === "AFTERNOON";
    const openTime = to12Hour(isAfternoon ? sb.afternoonStart : sb.morningStart);
    const closeTime = to12Hour(isAfternoon ? sb.afternoonEnd : sb.morningEnd);
    const label = (sb.customLabel || "").trim() || (isAfternoon ? "Afternoon" : "Morning");
    const slotId = sb.editingSlotId;
    sb.editingSlotId = "";
    sb.customLabel = "";
    await saveNode("chamber_schedules", slotId, {
      chamberId: chId,
      doctorId: ch.doctorId,
      dayOfWeek: sb.selectedDays[0],
      openTime,
      closeTime,
      slotLabel: label
    });
    return;
  }

  // Build slot templates based on Option A (Morning), Option B (Afternoon), or Option C (Both)
  const templates = [];
  if (sb.timeOption === "MORNING" || sb.timeOption === "BOTH") {
    templates.push({
      openTime: to12Hour(sb.morningStart),
      closeTime: to12Hour(sb.morningEnd),
      slotLabel: (sb.timeOption === "MORNING" && sb.customLabel.trim()) ? sb.customLabel.trim() : "Morning"
    });
  }
  if (sb.timeOption === "AFTERNOON" || sb.timeOption === "BOTH") {
    templates.push({
      openTime: to12Hour(sb.afternoonStart),
      closeTime: to12Hour(sb.afternoonEnd),
      slotLabel: (sb.timeOption === "AFTERNOON" && sb.customLabel.trim()) ? sb.customLabel.trim() : "Afternoon"
    });
  }

  const existingForChamber = Object.values(dbState.chamber_schedules).filter(s => s.chamberId === chId);
  const patch = {};
  let addedCount = 0;

  for (const day of sb.selectedDays) {
    for (const tpl of templates) {
      const duplicate = existingForChamber.some(s =>
        s.dayOfWeek === day &&
        s.openTime.toUpperCase() === tpl.openTime.toUpperCase() &&
        s.closeTime.toUpperCase() === tpl.closeTime.toUpperCase()
      );
      if (duplicate) continue;
      const newId = uid("sch");
      patch[newId] = {
        chamberId: chId,
        doctorId: ch.doctorId,
        dayOfWeek: day,
        openTime: tpl.openTime,
        closeTime: tpl.closeTime,
        slotLabel: tpl.slotLabel
      };
      addedCount++;
    }
  }

  if (addedCount === 0) {
    toast("Those exact weekly time slots already exist for this chamber.");
    return;
  }

  await patchCollectionNodes(
    "chamber_schedules",
    patch,
    `Added ${addedCount} weekly time slot${addedCount > 1 ? "s" : ""} for ${ch.facilityName}!`
  );
}

function exportCsv(type) {
  const rows = Object.entries(dbState[type]);
  if (!rows.length) return toast("No data to export.");
  const keys = Object.keys(rows[0][1]);
  const csv = [ ["id", ...keys].join(","), ...rows.map(([id, obj]) => [id, ...keys.map(k => `"${String(obj[k]??"").replace(/"/g,'""')}"`)].join(",")) ].join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `doctor_list_bd_${type}.csv`;
  a.click();
}
