<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor List BD</title>
  <script>
    // Preserve clean URL path and query string on static hosts (e.g., GitHub Pages)
    (function () {
      var loc = window.location;
      var target = loc.pathname + loc.search;
      if (target && target !== "/" && target !== "/index.html") {
        loc.replace("/?p=" + encodeURIComponent(target));
      } else {
        loc.replace("/");
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to Doctor List BD...</p>
</body>
</html>
